services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: centralink
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d centralink"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    volumes:
      - ./src:/app/src
      - ./templates:/app/templates
      - ./config:/app/config
    ports:
      - "8000:8000"
    environment:
      APP_ENV: prod
      APP_SECRET: changeme-soutenance
      DATABASE_URL: "postgresql://app:app@db:5432/centralink?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      MAILER_DSN: "null://null"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
